<!doctype html>
<html lang="fr"><body style="margin:0;padding:24px;background:#6b62cc;font-family:Arial,sans-serif;color:#252124">
  <div style="max-width:420px;margin:auto;padding:24px;background:#fff9e9;border:2px solid #252124;border-radius:14px">
    <h1 style="margin:0 0 20px;font-size:24px">Le Jeu du Duc</h1>
    <p>Ton code pour confirmer ton compte :</p>
    <p style="padding:16px;background:#f7c3d0;border:2px solid #252124;border-radius:8px;font-size:32px;font-weight:bold;letter-spacing:6px;text-align:center">{{ .Token }}</p>
    <p>Entre ce code dans le jeu.</p>
    <p><a href="{{ .ConfirmationURL }}" style="color:#252124">Confirmer avec un lien</a></p>
    <p style="font-size:13px">Si tu n’as pas demandé ce compte, ignore cet email.</p>
  </div>
</body></html>
